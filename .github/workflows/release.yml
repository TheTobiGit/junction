name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-publish:
    name: Build & Publish Release
    runs-on: macos-14
    timeout-minutes: 60
    env:
      APP_NAME: Junction
      CLI_NAME: junction
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Extract version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${TAG}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: spm-release-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-release-${{ runner.os }}-

      - name: Build release artifacts
        run: ./build-app.sh release

      - name: Verify artifacts
        run: |
          test -d "build/${APP_NAME}.app"
          test -x "build/${CLI_NAME}"
          file "build/${APP_NAME}.app/Contents/MacOS/${APP_NAME}"
          file "build/${CLI_NAME}"

      - name: Package artifacts
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          cd build
          APP_ZIP="${APP_NAME}-${VERSION}-macos.zip"
          CLI_ZIP="${CLI_NAME}-cli-${VERSION}-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "${APP_NAME}.app" "${APP_ZIP}"
          ditto -c -k --sequesterRsrc "${CLI_NAME}" "${CLI_ZIP}"
          shasum -a 256 "${APP_ZIP}" "${CLI_ZIP}" > "checksums-${VERSION}.txt"
          echo "app_zip=build/${APP_ZIP}" >> "$GITHUB_OUTPUT"
          echo "cli_zip=build/${CLI_ZIP}" >> "$GITHUB_OUTPUT"
          echo "checksums=build/checksums-${VERSION}.txt" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from commits
        id: notes
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "## Changes"
            echo
            if [ -n "${PREV_TAG}" ]; then
              echo "Since \`${PREV_TAG}\`:"
              echo
              git log --pretty='- %s (%h)' "${PREV_TAG}..${GITHUB_REF_NAME}"
            else
              echo "Initial release."
              echo
              git log --pretty='- %s (%h)' "${GITHUB_REF_NAME}"
            fi
            echo
            echo "## Artifacts"
            echo
            echo "- \`${APP_NAME}-${{ steps.ver.outputs.version }}-macos.zip\` — Junction.app"
            echo "- \`${CLI_NAME}-cli-${{ steps.ver.outputs.version }}-macos.zip\` — junction CLI"
            echo "- \`checksums-${{ steps.ver.outputs.version }}.txt\` — SHA-256 sums"
            echo
            echo "> Builds are ad-hoc signed. Add an Apple Developer ID certificate to repo secrets to enable proper signing/notarization."
          } > RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.pkg.outputs.app_zip }}
            ${{ steps.pkg.outputs.cli_zip }}
            ${{ steps.pkg.outputs.checksums }}
