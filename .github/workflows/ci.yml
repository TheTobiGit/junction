name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default-deny token scope. Each job opts in explicitly below.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        # SHA-pinned per CVE-2025-30066 / CVE-2025-30154 mitigation.
        # Dependabot will rewrite the SHA and update the comment.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # No git credentials kept on disk — defeats credential theft via
          # later-step command injection (Nx s1ngularity pattern).
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM build
        # Cache key namespaced by event_name so PR caches cannot
        # be restored on push-to-main runs (cache-poisoning defense
        # against the TanStack May 2026 attack pattern).
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: spm-${{ github.event_name }}-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-${{ github.event_name }}-${{ runner.os }}-

      - name: Build (debug)
        run: swift build -c debug --product Junction --product JunctionCLI

      - name: Test
        run: swift test --parallel

      - name: Build app bundle (release, smoke check)
        run: ./build-app.sh release
