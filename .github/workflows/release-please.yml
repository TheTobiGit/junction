name: Release Please

on:
  # Run on every push to main so the open release PR stays in sync
  # with all conventional commits, not just those that touch
  # binary-affecting paths. The expensive build-publish job below is
  # still gated on `needs.release-please.outputs.released == 'true'`,
  # so non-release pushes only pay for the lightweight release-please
  # action itself.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build/upload assets for (for retrying a partial release)
        required: false
        type: string
      release_version:
        description: Version without leading v for release_tag (for example, 0.9.0)
        required: false
        type: string

# Default-deny token scope. Each job opts in explicitly below.
permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.releases_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      # GitHub deliberately does not trigger workflow runs for pushes made
      # with GITHUB_TOKEN (anti-recursion rule). release-please force-pushes
      # the release branch using GITHUB_TOKEN by default, so the required
      # "Build & Test" status check never runs and the release PR is
      # permanently blocked from merging. Using a GitHub App token instead
      # causes GitHub to treat the push as coming from a real actor, which
      # fires the workflow normally and lets the required check pass.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  build-publish:
    name: Build & Attach Release Assets
    needs: release-please
    if: needs.release-please.outputs.released == 'true' || inputs.release_tag != ''
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      APP_NAME: Junction
      CLI_NAME: junction
      TAG: ${{ needs.release-please.outputs.tag || inputs.release_tag }}
      VERSION: ${{ needs.release-please.outputs.version || inputs.release_version }}
    steps:
      - name: Validate release inputs
        run: |
          if [[ -z "${TAG}" || -z "${VERSION}" ]]; then
            echo "::error::TAG and VERSION are required. For manual retries, pass release_tag (vX.Y.Z) and release_version (X.Y.Z)."
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag || inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Sync Info.plist version
        run: |
          PLIST="Resources/Info.plist"
          # CFBundleShortVersionString accepts any SemVer string.
          # CFBundleVersion must be dot-separated integers — strip any
          # prerelease suffix (e.g. 0.2.0-beta.1 → 0.2.0) and append the
          # CI run number so it's monotonically increasing across re-runs.
          SHORT="$VERSION"
          BUILD="${VERSION%%-*}.${GITHUB_RUN_NUMBER}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $SHORT" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"

      # No build cache on the release path. A poisoned cache from a
      # CI run cannot influence a release artifact this way. Trade
      # 1-2 minutes of build time for zero cache-poisoning surface.

      - name: Import Developer ID signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          if [[ -z "${CERT_P12_BASE64}" || -z "${CERT_PASSWORD}" ]]; then
            echo "::error::APPLE_DEVELOPER_ID_CERT_P12_BASE64 / APPLE_DEVELOPER_ID_CERT_PASSWORD secrets are required for notarized releases."
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n1)"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No Developer ID Application identity found in imported keychain."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "JUNCTION_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Imported $IDENTITY"

      - name: Build release artifacts
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_FEED_URL: https://github.com/TheTobiGit/junction/releases/latest/download/appcast.xml
        run: |
          if [[ -z "${SPARKLE_PUBLIC_ED_KEY}" ]]; then
            echo "::error::SPARKLE_PUBLIC_ED_KEY secret is required for Sparkle release builds."
            exit 1
          fi
          ./build-app.sh release

      - name: Verify signatures
        run: |
          test -d "build/${APP_NAME}.app"
          test -x "build/${CLI_NAME}"
          codesign --verify --strict --verbose=2 "build/${APP_NAME}.app"
          codesign --verify --strict --verbose=2 "build/${CLI_NAME}"
          codesign --display --verbose=4 "build/${APP_NAME}.app" 2>&1 | grep -q "Developer ID Application"
          codesign --display --entitlements :- "build/${APP_NAME}.app" | grep -q "com.apple.security.automation.apple-events"

      - name: Notarize app and CLI
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "${APPLE_ID}" || -z "${APPLE_APP_PASSWORD}" || -z "${APPLE_TEAM_ID}" ]]; then
            echo "::error::APPLE_NOTARY_APPLE_ID / APPLE_NOTARY_PASSWORD / APPLE_TEAM_ID secrets are required."
            exit 1
          fi
          xcrun notarytool store-credentials "junction-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" >/dev/null

          APP_NOTARY_ZIP="$RUNNER_TEMP/${APP_NAME}-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "build/${APP_NAME}.app" "$APP_NOTARY_ZIP"
          xcrun notarytool submit "$APP_NOTARY_ZIP" --keychain-profile "junction-notary" --wait
          xcrun stapler staple "build/${APP_NAME}.app"
          xcrun stapler validate "build/${APP_NAME}.app"
          spctl --assess --type execute --verbose=4 "build/${APP_NAME}.app" || {
            echo "::error::Gatekeeper assessment failed for ${APP_NAME}.app"
            exit 1
          }

          CLI_NOTARY_ZIP="$RUNNER_TEMP/${CLI_NAME}-notary.zip"
          ditto -c -k --sequesterRsrc "build/${CLI_NAME}" "$CLI_NOTARY_ZIP"
          xcrun notarytool submit "$CLI_NOTARY_ZIP" --keychain-profile "junction-notary" --wait

      - name: Build and notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH="build/${APP_NAME}-${VERSION}.dmg"
          ./scripts/make-dmg.sh "build/${APP_NAME}.app" "$DMG_PATH" "${APP_NAME} ${VERSION}"
          xcrun notarytool submit "$DMG_PATH" --keychain-profile "junction-notary" --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH" || {
            echo "::error::Gatekeeper assessment failed for ${DMG_PATH}"
            exit 1
          }

      - name: Package artifacts
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent "${APP_NAME}.app" "${APP_NAME}-${VERSION}-macos.zip"
          ditto -c -k --sequesterRsrc "${CLI_NAME}" "${CLI_NAME}-cli-${VERSION}-macos.zip"
          shasum -a 256 \
            "${APP_NAME}-${VERSION}-macos.zip" \
            "${APP_NAME}-${VERSION}.dmg" \
            "${CLI_NAME}-cli-${VERSION}-macos.zip" \
            > "checksums-${VERSION}.txt"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          if [[ -z "${SPARKLE_PRIVATE_ED_KEY}" ]]; then
            echo "::error::SPARKLE_PRIVATE_ED_KEY secret is required to sign the Sparkle appcast."
            exit 1
          fi
          SPARKLE_TOOLS=".build/artifacts/sparkle/Sparkle/bin"
          test -x "${SPARKLE_TOOLS}/generate_appcast"
          FEED_DIR="build/sparkle-feed"
          mkdir -p "${FEED_DIR}"
          cp "build/${APP_NAME}-${VERSION}-macos.zip" "${FEED_DIR}/"
          # Embed this version's release notes. generate_appcast picks up an
          # HTML file whose basename matches the archive and inlines it as the
          # update <description>, so Sparkle's notes pane renders instantly from
          # the appcast instead of spinning while it loads the GitHub release page.
          ./scripts/changelog-to-html.sh "${VERSION}" \
            > "${FEED_DIR}/${APP_NAME}-${VERSION}-macos.html"
          printf '%s' "${SPARKLE_PRIVATE_ED_KEY}" | \
            "${SPARKLE_TOOLS}/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/TheTobiGit/junction/releases/download/${TAG}/" \
              --full-release-notes-url "https://github.com/TheTobiGit/junction/releases/tag/${TAG}" \
              -o "build/appcast.xml" \
              "${FEED_DIR}"
          test -s "build/appcast.xml"

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" \
            "build/${APP_NAME}-${VERSION}-macos.zip" \
            "build/${APP_NAME}-${VERSION}.dmg" \
            "build/${CLI_NAME}-cli-${VERSION}-macos.zip" \
            "build/checksums-${VERSION}.txt" \
            "build/appcast.xml" \
            --clobber

      # If any step above failed, the release-please job has already
      # created a public GitHub Release (and git tag) for this version,
      # but its assets are missing or partial. Delete the release and
      # its tag so a failed run never leaves a published-but-broken
      # release; the next push to main (or a manual workflow_dispatch
      # retry) recreates it cleanly. Guarded to the automatic path only:
      # a manual retry (workflow_dispatch with release_tag) targets a
      # release that already existed before this run, so it must NOT be
      # torn down just because a rebuild failed.
      - name: Roll back release on failure
        if: failure() && inputs.release_tag == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::warning::Release build failed before assets were fully attached; rolling back release $TAG and its tag."
          gh release delete "$TAG" --cleanup-tag --yes || true

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer_id.p12"
